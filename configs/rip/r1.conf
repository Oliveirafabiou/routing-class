# R1 - RIP v2 (vetor de distância). Timers reduzidos para a demonstração.
router id 1.1.1.1;
log "/var/log/bird.log" all;

protocol device { }

protocol direct {
  ipv4;
  interface "eth*";
}

protocol kernel {
  ipv4 { import none; export where source = RTS_RIP; };
}

protocol rip {
  ipv4 { import all; export where source ~ [RTS_DEVICE, RTS_RIP]; };
  interface "eth*" {
    version 2;
    update time 5;
    timeout time 20;
    garbage time 20;
  };
}
