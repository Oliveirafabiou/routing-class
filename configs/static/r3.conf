# R3 - modo ESTATICO (apenas para validar a topologia)
router id 1.1.1.3;
log "/var/log/bird.log" all;

protocol device { }

protocol kernel {
  ipv4 { import none; export where source = RTS_STATIC; };
}

protocol static {
  ipv4;
  route 192.168.1.0/24 via 10.0.23.1;
  route 192.168.2.0/24 via 10.0.23.1;
  route 192.168.4.0/24 via 10.0.34.2;
  route 192.168.5.0/24 via 10.0.34.2;
}
